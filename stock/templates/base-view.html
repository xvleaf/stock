{# base.html #}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    
    <title>{% block title %}well{% endblock %}</title>
    {% load static %}
    <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"> -->
    <link rel="stylesheet" href="{% static 'base/css/bootstrap.min.css' %}" />
    <!-- <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"> -->
    <!-- Font Awesome CSS及字体下载地址：https://github.com/FortAwesome/Font-Awesome/releases/download/6.4.0/fontawesome-free-6.4.0-web.zip -->
    <!-- Font Awesome CSS需要与字体（webfonts 文件夹）一起使用 -->
    <link rel="stylesheet" href="{% static 'base/css/all.min.css' %}" />
    <link rel="stylesheet" href="{% static 'base/css/main.css' %}" />

    {% block extra_css %}{% endblock %}

    <link rel="icon" type="image/svg+xml" href="{% static 'base/icon/favicon.svg' %}">
    <!-- Safari 浏览器图标 -->
    <link rel="icon" type="image/png" sizes="192x192" href="{% static 'base/icon/favicon.png' %}">
    <!-- iPhone 主屏幕图标 -->
    <link rel="apple-touch-icon-precomposed" sizes="180x180" href="{% static 'base/icon/apple-touch-icon.png' %}">

</head>
<body>
    {# 全局导航组件 #}
    {% block nav %}{% include "base-navi.html" %}{% endblock %}

    {# 导航与页面之间空隙 #}
    <div id="gap"></div>

    {# 全局页面组件 #}
    <div class="page-content" id="pageContent">
        {% block content %}{% endblock %}
    </div>

    <script src="{% static 'base/js/bootstrap.bundle.min.js' %}"></script>
    <!-- 不采用全局引入base.js，否则全局脚本与ES Module冲突，造成重复监听、状态隔离；全部页面改用import模块导入 -->
    {% block extra_js %}{% endblock %}    
</body>
</html>
