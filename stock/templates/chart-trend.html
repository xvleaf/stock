<div class="chart-page" id="chartPage">
    <div class="chart-wrap">
        {# 占位层 #}
        <div id="chartPlaceholder" class="chart-placeholder">
            <div class="chart-placeholder-text">图表加载中...</div>
        </div>
        <div id="chartContainer" class="chart-container"></div>

        <div id="trendParam" class="chart-param d-none">
            <div id="plusBtn" class="param-label metric-dark pointer">
                <i class="fa-solid fa-circle-plus"></i>
            </div>            
            <div id="exitBtn" class="param-label metric-dark pointer">
                <i class="fa-regular fa-trash-can"></i>
            </div>
            <div id="editBtn" class="param-label metric-dark pointer">
                <i class="fa-solid fa-pen-to-square"></i>
            </div>
            <div id="dealBtn" class="param-label metric-dark pointer">
                <i class="fa-solid fa-cart-plus"></i>
            </div>
            <div id="divdBtn" class="param-label metric-dark pointer">
                <i class="fa-solid fa-percent"></i>
            </div>
            <div id="fullScreen" class="param-label metric-dark pointer" >
                <i class="fa-solid fa-down-left-and-up-right-to-center"></i>
            </div>
        </div>
    
        {# 股票信息：点击名称切换K线/分时图 #}
        <div class="chart-stock-name">
            <span id="naviIndicator" class="chart-kline-navi"></span>
            <span id="nameItem" class="pointer"></span>
            <span id="codeItem"></span>
        </div>
        
        {% block chart-navi %}{% include "chart-navi.html" %}{% endblock %}
    </div>
</div>
