{% extends "base-view.html" %}
{% block title %}筛选对比{% endblock %}
{% block content %}
<div class="form-wrap">
    <div class="row g-2 align-items-end mb-3">
        <div class="col">
            <label class="form-label small mb-1">筛选 A</label>
            <select id="taskA" class="form-select form-select-sm">
                {% for t in tasks %}
                <option value="{{ t.id }}">#{{ t.id }} {{ t.name }}（{{ t.stock_count }}）</option>
                {% endfor %}
            </select>
        </div>
        <div class="col">
            <label class="form-label small mb-1">筛选 B</label>
            <select id="taskB" class="form-select form-select-sm">
                {% for t in tasks %}
                <option value="{{ t.id }}">#{{ t.id }} {{ t.name }}（{{ t.stock_count }}）</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-auto">
            <button type="button" class="btn btn-primary btn-sm" id="referBtn">对比</button>
        </div>
    </div>

    <div id="referSummary" class="small mb-2"></div>

    <div id="fixedHeader">
        <div class="fixed-header-inner"><div class="fixed-header-row" id="fixedHeaderRow"></div></div>
    </div>
    <div class="table-responsive" id="tableWrap">
        <table class="table table-stock table-hover" id="stockTable">
            <thead id="originalThead">
                <tr>
                    <th style="width:10%;">序号</th>
                    <th style="width:20%;">代码</th>
                    <th style="width:40%;">名称</th>
                    <th style="width:30%;">归属</th>
                </tr>
            </thead>
            <tbody id="stockBody"></tbody>
        </table>
    </div>
</div>
{% endblock %}

{% block extra_js %}
{% load static %}
<script type="module">
    import { baseInit } from "{% static 'base/js/base.js' %}";
    import { tableHeaderInit } from "{% static 'stock/js/list.js' %}";
    import { initFilterRefer } from "{% static 'stock/js/filter.js' %}";

    document.addEventListener('DOMContentLoaded', () => {
        baseInit();
        tableHeaderInit();
        initFilterRefer();
    });
</script>
{% endblock %}
