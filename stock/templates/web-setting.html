{% extends "base-view.html" %}
{% load static %}
{% block title %}参数设置{% endblock %}
{% block content %}
<div class="form-wrap">
    <h6 class="mb-3">参数设置</h6>

    <form method="post" id="settingForm">
        {% csrf_token %}

        <!-- 通用设置 -->
        <div class="card mb-3">
            <div class="card-body">
                <h6 class="mb-3">通用设置</h6>
                <div class="row g-3">
                    <div class="col-md-3 col-sm-6">
                        <label class="form-label small mb-1">备案编号</label>
                        <input type="text" name="icp_number" class="form-control form-control-sm" value="{{ setting.icp_number }}">
                    </div>
                    <div class="col-md-3 col-sm-6">
                        <label class="form-label small mb-1">备案官网</label>
                        <input type="text" name="icp_website" class="form-control form-control-sm" value="{{ setting.icp_website }}">
                    </div>
                    <div class="col-md-3 col-sm-6">
                        <label class="form-label small mb-1">分页默认数量</label>
                        <div class="input-group input-group-sm">
                            <input type="text" name="default_page_size" class="form-control" value="{{ setting.default_page_size }}">
                            <span class="input-group-text">条</span>
                        </div>
                    </div>
                    <div class="col-md-3 col-sm-6">
                        <label class="form-label small mb-1">行情刷新间隔</label>
                        <div class="input-group input-group-sm">
                            <input type="text" name="quote_interval" class="form-control" value="{{ setting.quote_interval }}">
                            <span class="input-group-text">秒</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 交易费用 -->
        <div class="card mb-3">
            <div class="card-body">
                <h6 class="mb-3">交易费用</h6>
                <div class="row g-3">
                    <div class="col-md-3 col-sm-6">
                        <label class="form-label small mb-1">佣金费率</label>
                        <div class="input-group input-group-sm">
                            <input type="text" name="commission_ratio" class="form-control" value="{{ commission_ratio_pct }}">
                            <span class="input-group-text">%</span>
                        </div>
                    </div>
                    <div class="col-md-3 col-sm-6">
                        <label class="form-label small mb-1">最低佣金</label>
                        <div class="input-group input-group-sm">
                            <input type="text" name="commission_min" class="form-control" value="{{ commission_min_fmt }}">
                            <span class="input-group-text">元</span>
                        </div>
                    </div>
                    <div class="col-md-3 col-sm-6">
                        <label class="form-label small mb-1">印花税率（买入）</label>
                        <div class="input-group input-group-sm">
                            <input type="text" name="stamp_buy_ratio" class="form-control" value="{{ stamp_buy_ratio_pct }}">
                            <span class="input-group-text">%</span>
                        </div>
                    </div>
                    <div class="col-md-3 col-sm-6">
                        <label class="form-label small mb-1">印花税率（卖出）</label>
                        <div class="input-group input-group-sm">
                            <input type="text" name="stamp_sell_ratio" class="form-control" value="{{ stamp_sell_ratio_pct }}">
                            <span class="input-group-text">%</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 过户费用 -->
        <div class="card mb-3">
            <div class="card-body">
                <h6 class="mb-3">过户费用</h6>
                <div class="row g-3">
                    <div class="col-md-4 col-sm-12">
                        <label class="form-label small mb-1">沪市</label>
                        <div class="input-group input-group-sm">
                            <input type="text" name="transfer_fee_sh" class="form-control" value="{{ transfer_fee_sh_pct }}">
                            <span class="input-group-text">%</span>
                        </div>
                    </div>
                    <div class="col-md-4 col-sm-12">
                        <label class="form-label small mb-1">深市</label>
                        <div class="input-group input-group-sm">
                            <input type="text" name="transfer_fee_sz" class="form-control" value="{{ transfer_fee_sz_pct }}">
                            <span class="input-group-text">%</span>
                        </div>
                    </div>
                    <div class="col-md-4 col-sm-12">
                        <label class="form-label small mb-1">北交所</label>
                        <div class="input-group input-group-sm">
                            <input type="text" name="transfer_fee_bj" class="form-control" value="{{ transfer_fee_bj_pct }}">
                            <span class="input-group-text">%</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 分红税率 -->
        <div class="card mb-3">
            <div class="card-body">
                <h6 class="mb-3">分红税率</h6>
                <div class="row g-3">
                    <div class="col-md-4 col-sm-12">
                        <label class="form-label small mb-1">持股 > 1年</label>
                        <div class="input-group input-group-sm">
                            <input type="text" name="dividend_tax_long" class="form-control" value="{{ dividend_tax_long_pct }}">
                            <span class="input-group-text">%</span>
                        </div>
                    </div>
                    <div class="col-md-4 col-sm-12">
                        <label class="form-label small mb-1">持股 ≥ 1月</label>
                        <div class="input-group input-group-sm">
                            <input type="text" name="dividend_tax_mid" class="form-control" value="{{ dividend_tax_mid_pct }}">
                            <span class="input-group-text">%</span>
                        </div>
                    </div>
                    <div class="col-md-4 col-sm-12">
                        <label class="form-label small mb-1">持股 < 1月</label>
                        <div class="input-group input-group-sm">
                            <input type="text" name="dividend_tax_short" class="form-control" value="{{ dividend_tax_short_pct }}">
                            <span class="input-group-text">%</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 交易时间 -->
        <div class="card mb-3">
            <div class="card-body">
                <h6 class="mb-3">交易时间</h6>
                <div class="row g-3">
                    <div class="col-md-3 col-sm-6">
                        <label class="form-label small mb-1">上午开始时间</label>
                        <input type="text" name="trade_am_start" class="form-control form-control-sm" value="{{ trade_am_start_fmt }}" placeholder="HH:MM">
                    </div>
                    <div class="col-md-3 col-sm-6">
                        <label class="form-label small mb-1">上午结束时间</label>
                        <input type="text" name="trade_am_end" class="form-control form-control-sm" value="{{ trade_am_end_fmt }}" placeholder="HH:MM">
                    </div>
                    <div class="col-md-3 col-sm-6">
                        <label class="form-label small mb-1">下午开始时间</label>
                        <input type="text" name="trade_pm_start" class="form-control form-control-sm" value="{{ trade_pm_start_fmt }}" placeholder="HH:MM">
                    </div>
                    <div class="col-md-3 col-sm-6">
                        <label class="form-label small mb-1">下午结束时间</label>
                        <input type="text" name="trade_pm_end" class="form-control form-control-sm" value="{{ trade_pm_end_fmt }}" placeholder="HH:MM">
                    </div>
                </div>
            </div>
        </div>

        <!-- K线参数 -->
        <div class="card mb-3">
            <div class="card-body">
                <h6 class="mb-3">K线参数</h6>
                <div class="row g-3">
                    <div class="col-md-4 col-12">
                        <label class="form-label small mb-1">日线起始日期</label>
                        <input type="text" name="kline_start_date_day" class="form-control form-control-sm" value="{{ setting.kline_start_date_day }}" placeholder="YYYYMMDD">
                    </div>
                    <div class="col-md-4 col-12">
                        <label class="form-label small mb-1">周线起始日期</label>
                        <input type="text" name="kline_start_date_week" class="form-control form-control-sm" value="{{ setting.kline_start_date_week }}" placeholder="YYYYMMDD">
                    </div>
                    <div class="col-md-4 col-12">
                        <label class="form-label small mb-1">月线起始日期</label>
                        <input type="text" name="kline_start_date_month" class="form-control form-control-sm" value="{{ setting.kline_start_date_month }}" placeholder="YYYYMMDD">
                    </div>
                    <div class="col-md-4 col-12">
                        <label class="form-label small mb-1">日线MA周期</label>
                        <input type="text" name="kline_ma_day" class="form-control form-control-sm" value="{{ setting.kline_ma_day }}">
                    </div>
                    <div class="col-md-4 col-12">
                        <label class="form-label small mb-1">周线MA周期</label>
                        <input type="text" name="kline_ma_week" class="form-control form-control-sm" value="{{ setting.kline_ma_week }}">
                    </div>
                    <div class="col-md-4 col-12">
                        <label class="form-label small mb-1">月线MA周期</label>
                        <input type="text" name="kline_ma_month" class="form-control form-control-sm" value="{{ setting.kline_ma_month }}">
                    </div>
                    <div class="col-md-4 col-12">
                        <label class="form-label small mb-1">日线MV周期</label>
                        <input type="text" name="kline_mv_day" class="form-control form-control-sm" value="{{ setting.kline_mv_day }}">
                    </div>
                    <div class="col-md-4 col-12">
                        <label class="form-label small mb-1">周线MV周期</label>
                        <input type="text" name="kline_mv_week" class="form-control form-control-sm" value="{{ setting.kline_mv_week }}">
                    </div>
                    <div class="col-md-4 col-12">
                        <label class="form-label small mb-1">月线MV周期</label>
                        <input type="text" name="kline_mv_month" class="form-control form-control-sm" value="{{ setting.kline_mv_month }}">
                    </div>
                    <div class="col-md-4 col-12">
                        <label class="form-label small mb-1">日线EMA-K值</label>
                        <input type="text" name="kline_ema_k_day" class="form-control form-control-sm" value="{{ setting.kline_ema_k_day }}">
                    </div>
                    <div class="col-md-4 col-12">
                        <label class="form-label small mb-1">周线EMA-K值</label>
                        <input type="text" name="kline_ema_k_week" class="form-control form-control-sm" value="{{ setting.kline_ema_k_week }}">
                    </div>
                    <div class="col-md-4 col-12">
                        <label class="form-label small mb-1">月线EMA-K值</label>
                        <input type="text" name="kline_ema_k_month" class="form-control form-control-sm" value="{{ setting.kline_ema_k_month }}">
                    </div>
                    <div class="col-md-4 col-12">
                        <label class="form-label small mb-1">日线EMA-D值</label>
                        <input type="text" name="kline_ema_d_day" class="form-control form-control-sm" value="{{ setting.kline_ema_d_day }}">
                    </div>
                    <div class="col-md-4 col-12">
                        <label class="form-label small mb-1">周线EMA-D值</label>
                        <input type="text" name="kline_ema_d_week" class="form-control form-control-sm" value="{{ setting.kline_ema_d_week }}">
                    </div>
                    <div class="col-md-4 col-12">
                        <label class="form-label small mb-1">月线EMA-D值</label>
                        <input type="text" name="kline_ema_d_month" class="form-control form-control-sm" value="{{ setting.kline_ema_d_month }}">
                    </div>
                    <div class="col-md-4 col-12">
                        <label class="form-label small mb-1">K线最大密度</label>
                        <input type="text" name="density_max" class="form-control form-control-sm" value="{{ setting.density_max }}">
                    </div>
                    <div class="col-md-4 col-12">
                        <label class="form-label small mb-1">K线标准密度</label>
                        <input type="text" name="density_std" class="form-control form-control-sm" value="{{ setting.density_std }}">
                    </div>
                    <div class="col-md-4 col-12">
                        <label class="form-label small mb-1">K线最小密度</label>
                        <input type="text" name="density_min" class="form-control form-control-sm" value="{{ setting.density_min }}">
                    </div>
                </div>
            </div>
        </div>

    </form>
</div>
{% endblock %}

{% block extra_js %}
<script type="module">
    import { initSetting } from "{% static 'stock/js/setting.js' %}";
    initSetting({% if saved %}true{% else %}false{% endif %}, {% if error %}true{% else %}false{% endif %});
</script>
{% endblock %}
