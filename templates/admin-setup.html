<!doctype html>

<html lang="zh-CN">
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=contain"/>
    <meta http-equiv="X-UA-Compatible" content="ie=edge"/>

    <title>初始化账号</title>

    {% load static %}
    <link rel="shortcut icon" type="image/x-icon" href="{% static 'base/icon/favicon.svg' %}"/>
    <link rel="Bookmark" type="image/x-icon"  href="{% static 'base/icon/favicon.svg' %}"/>
    <link rel="apple-touch-icon" sizes="240x240" href="{% static 'base/icon/favicon.png' %}">

    <link rel="stylesheet" href="{% static 'base/lib/bootstrap/bootstrap.min.css' %}"/>

    <style>
        .frame-login {
            position:relative;
            width: min(calc(var(--frame-width) * 0.85), 400px);
            height: var(--frame-height);
            margin-left: auto;
            margin-right: auto;
        }
        .login-content {
            position:absolute;
            background: white;
            padding: 25px;
            border-radius: 5px;
            width: 100%;
            margin-top: max(calc((var(--frame-height) - 400px) / 2), 10px);
        }
        .login-foot {
            position:absolute;
            width: 100%;
            bottom: 25px;
            display: flex;
            justify-content: center;
        }
    </style>
  </head>
  <body>

    <script>
        // frame-width 取“设定中的页面宽度”（断点 bp1/bp2/bp3 选择宽度百分比 w1/w2/w3/w4，
        // 与主站 main.css 的 clamp 切换同口径）；frame-height 取视口高度
        const doc = document.documentElement;
        const BP = [{{ ui_config.bp1 }}, {{ ui_config.bp2 }}, {{ ui_config.bp3 }}];
        const W  = [{{ ui_config.w1 }}, {{ ui_config.w2 }}, {{ ui_config.w3 }}, {{ ui_config.w4 }}];

        function calcFrameWidth() {
            const vw = window.innerWidth;
            let pct = W[3];
            for (let i = 0; i < BP.length; i++) {
                if (vw < BP[i]) { pct = W[i]; break; }
            }
            return vw * pct / 100;
        }
        function applyFrame() {
            doc.style.setProperty('--frame-width', calcFrameWidth() + 'px');
            doc.style.setProperty('--frame-height', window.innerHeight + 'px');
        }
        applyFrame();
        window.addEventListener('resize', applyFrame);
    </script>

    <div class="frame-login">
      <div class="login-content">
        <div class="card-body">
          <h2 class="h3 text-center mb-4">初始化账号</h2>
            <form action="{% url 'admin_setup' %}" method="post" autocomplete="off" novalidate>

                {% csrf_token %}

                <div class="mb-3">
                  <label for="{{ form.username.id_for_label }}" class="form-label">账号名称</label>
                  <input type="text" name="{{ form.username.html_name }}"
                         id="{{ form.username.id_for_label }}"
                         class="form-control{% if form.username.errors %} is-invalid{% endif %}"
                         placeholder="输入账号名称" autocomplete="off" autofocus>
                  {% for error in form.username.errors %}
                    <div class="invalid-feedback">{{ error }}</div>
                  {% endfor %}
                </div>

                <div class="mb-2">
                  <label for="{{ form.password1.id_for_label }}" class="form-label">密 &nbsp; &nbsp; &nbsp; &nbsp;码</label>
                  <input type="password" name="{{ form.password1.html_name }}"
                         id="{{ form.password1.id_for_label }}"
                         class="form-control{% if form.password1.errors %} is-invalid{% endif %}"
                         placeholder="输入密码" autocomplete="new-password">
                  {% for error in form.password1.errors %}
                    <div class="invalid-feedback d-block">{{ error }}</div>
                  {% endfor %}
                </div>

                <div class="mb-4">
                  <label for="{{ form.password2.id_for_label }}" class="form-label">确认密码</label>
                  <input type="password" name="{{ form.password2.html_name }}"
                         id="{{ form.password2.id_for_label }}"
                         class="form-control{% if form.password2.errors %} is-invalid{% endif %}"
                         placeholder="再次输入密码" autocomplete="new-password">
                  {% for error in form.password2.errors %}
                    <div class="invalid-feedback d-block">{{ error }}</div>
                  {% endfor %}
                </div>

                <div class="mb-2">
                  <button type="submit" class="btn btn-primary w-100">创建账号</button>
                </div>
            </form>
        </div>
      </div>
    </div>

  </body>
</html>
