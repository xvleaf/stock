{# 统一底部分页控件：居中，顺序 页码 → 上一页/下一页 → 每页数量 #}
<div class="d-flex justify-content-center align-items-center gap-3 py-2 list-pagination">
    <span class="text-muted" style="font-size:0.875rem;">第 <span class="page-jump-input" contenteditable="true" data-page="{{ current_page }}" data-max="{{ total_pages }}" style="display:inline;outline:none;cursor:text;border:none;background:transparent;padding:0;color:inherit;">{{ current_page }}</span> / {{ total_pages }} 页</span>
    <div class="btn-group btn-group-sm">
        <button type="button" class="btn btn-outline-secondary page-prev"
                data-page="{{ current_page|add:'-1' }}"
                {% if current_page <= 1 %}disabled{% endif %}>上一页</button>
        <button type="button" class="btn btn-outline-secondary page-next"
                data-page="{{ current_page|add:'1' }}"
                {% if current_page >= total_pages %}disabled{% endif %}>下一页</button>
    </div>
    <span class="text-muted" style="font-size:0.875rem;">每页 <span class="page-size-input" contenteditable="true" data-size="{{ per_page }}" style="display:inline;outline:none;cursor:text;border:none;background:transparent;padding:0;color:inherit;">{{ per_page }}</span> 行</span>
</div>
